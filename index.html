<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Pulp</title>
<meta name="description" content="Suivi de prise de masse : entraînement, nutrition et poids.">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#C3FF52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pulp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  html, body{margin:0; padding:0; overflow-x:clip;}
  html{
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }
  *{-webkit-tap-highlight-color:transparent;}
  :root{
    --bg:#F3F0E4;
    --fleck-1:#c9ff5e; --fleck-2:#14150f; --fleck-3:#ff7a52; --fleck-4:#e7e2cf;
    --ink:#14150f;
    --lime:#c3ff52;
    --lime-deep:#7fae1c;
    --coral:#ff6b45;
    --surface:#fffdf6;
    --surface-2:#eae5d3;
    --muted:#6f7260;
    --muted-2:#9a9c86;
    --line:#ddd7c1;
    --good:#4f9c3a;
    --warn:#c98a1f;
    --bad:#d1483a;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121309;
      --fleck-1:#4f6b12; --fleck-2:#c3ff52; --fleck-3:#7a2c1a; --fleck-4:#1c1d12;
      --ink:#F3F0E4;
      --lime:#c3ff52;
      --lime-deep:#a4e02f;
      --coral:#ff8563;
      --surface:#1b1c13;
      --surface-2:#25261a;
      --muted:#a9ab93;
      --muted-2:#7d7f6a;
      --line:#34351f;
      --good:#7ecf62;
      --warn:#e2b04a;
      --bad:#ef6a5c;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#121309;
    --fleck-1:#4f6b12; --fleck-2:#c3ff52; --fleck-3:#7a2c1a; --fleck-4:#1c1d12;
    --ink:#F3F0E4;
    --lime:#c3ff52;
    --lime-deep:#a4e02f;
    --coral:#ff8563;
    --surface:#1b1c13;
    --surface-2:#25261a;
    --muted:#a9ab93;
    --muted-2:#7d7f6a;
    --line:#34351f;
    --good:#7ecf62;
    --warn:#e2b04a;
    --bad:#ef6a5c;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    background:
      radial-gradient(circle at 12% 22%, var(--fleck-1) 0 3px, transparent 3px),
      radial-gradient(circle at 78% 8%, var(--fleck-2) 0 2px, transparent 2px),
      radial-gradient(circle at 44% 62%, var(--fleck-3) 0 2.5px, transparent 2.5px),
      radial-gradient(circle at 88% 70%, var(--fleck-4) 0 3px, transparent 3px),
      radial-gradient(circle at 25% 85%, var(--fleck-2) 0 2px, transparent 2px),
      radial-gradient(circle at 60% 35%, var(--fleck-1) 0 1.8px, transparent 1.8px),
      radial-gradient(circle at 6% 60%, var(--fleck-3) 0 1.6px, transparent 1.6px),
      radial-gradient(circle at 95% 40%, var(--fleck-1) 0 2px, transparent 2px);
    background-size: 180px 180px;
    background-color: var(--bg);
    color: var(--ink);
    font-family:"Work Sans",system-ui,sans-serif;
    padding-inline:16px;
    padding-block: 12px calc(84px + env(safe-area-inset-bottom,0px));
    min-height:100%;
  }
  h1,h2,h3{font-family:"Big Shoulders Display",system-ui,sans-serif; text-transform:uppercase; letter-spacing:.01em; text-wrap:balance; margin:0;}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums;}
  .muted{color:var(--muted);}
  .container{max-width:560px; margin:0 auto;}

  /* topbar */
  .topbar{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; padding-block:6px 14px;}
  .brand{display:flex; align-items:baseline; gap:8px;}
  .brand h1{font-size:34px; font-weight:800; line-height:1;}
  .brand .tag{font-size:11px; letter-spacing:.06em; color:var(--muted); text-transform:uppercase;}
  .date-chip{font-size:12px; color:var(--muted); text-align:right; text-transform:capitalize;}
  .sync-dot{display:inline-block; width:7px;height:7px;border-radius:50%; background:var(--good); margin-right:5px; vertical-align:middle;}
  .sync-dot.off{background:var(--muted-2);}
  .sync-dot.busy{background:var(--warn);}

  .theme-toggle{display:inline-flex; align-items:center; gap:2px; background:var(--surface-2); border:1px solid var(--line); border-radius:20px; padding:3px; margin-left:10px;}
  .theme-btn{border:none; background:none; color:var(--muted); width:26px; height:26px; border-radius:16px; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .theme-btn svg{width:14px; height:14px;}
  .theme-btn.active{background:var(--ink); color:var(--bg);}

  /* week strip */
  .weekstrip{display:flex; gap:6px; margin-bottom:18px; overflow-x:auto; padding-bottom:2px;}
  .day-chip{flex:0 0 45px; background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:8px 2px; text-align:center; position:relative;}
  .day-chip .d{font-size:9.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em;}
  .day-chip .l{font-family:"Big Shoulders Display"; font-weight:700; font-size:12.5px; margin-top:2px; white-space:nowrap;}
  .day-chip.today{border-color:var(--ink); box-shadow: inset 0 0 0 1px var(--ink);}
  .day-chip.done{background:var(--lime);}
  .day-chip.done .l, .day-chip.done .d{color:var(--ink);}
  .day-chip .check{position:absolute; top:5px; right:7px; font-size:11px;}
  .day-chip.rest{opacity:.55;}

  /* cards */
  .card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px; margin-bottom:14px;}
  .card-title{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .card-title h2{font-size:18px; font-weight:700;}
  .eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:4px;}

  /* stat tiles */
  .stat-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(120px,1fr)); gap:10px;}
  .stat-tile{background:var(--surface-2); border-radius:14px; padding:12px 12px 10px;}
  .stat-tile .v{font-family:"Big Shoulders Display"; font-weight:800; font-size:26px; line-height:1;}
  .stat-tile .u{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em;}

  /* pet */
  .pet-card{display:flex; gap:14px; align-items:center;}
  .pet-canvas-wrap{flex:0 0 auto; width:88px; height:88px; display:flex; align-items:center; justify-content:center; background:var(--surface-2); border-radius:16px;}
  .pet-canvas-wrap canvas{image-rendering:pixelated; width:76px; height:76px; animation:petBreathe 2.6s ease-in-out infinite;}
  @keyframes petBreathe{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
  .pet-info{flex:1; min-width:0;}
  .pet-name-row{display:flex; align-items:baseline; gap:7px; margin-bottom:2px;}
  .pet-name{font-family:"Big Shoulders Display"; font-weight:800; font-size:19px;}
  .pet-stage{font-size:11.5px; color:var(--muted);}
  .pet-line{font-size:12.5px; color:var(--muted); margin-bottom:8px;}
  .pet-xptrack{height:6px; border-radius:4px; background:var(--surface-2); overflow:hidden;}
  .pet-xpfill{height:100%; background:var(--lime-deep); border-radius:4px;}
  .pet-xplabel{font-size:10.5px; color:var(--muted-2); margin-top:4px; font-family:"IBM Plex Mono";}

  /* progress bars */
  .prog-row{margin-bottom:10px;}
  .prog-row:last-child{margin-bottom:0;}
  .prog-label{display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:5px;}
  .prog-label .name{color:var(--muted); text-transform:uppercase; letter-spacing:.04em; font-size:11px;}
  .prog-track{height:9px; border-radius:5px; background:var(--surface-2); overflow:hidden;}
  .prog-fill{height:100%; border-radius:5px; background:var(--lime); transition:width .25s ease;}
  .prog-fill.over{background:var(--coral);}

  /* buttons */
  .btn{font-family:"Work Sans"; font-weight:600; font-size:14px; border-radius:12px; padding:11px 16px; border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer;}
  .btn:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}
  .btn-primary{background:var(--ink); color:var(--bg); border-color:var(--ink);}
  .btn-lime{background:var(--lime); border-color:var(--lime); color:var(--ink);}
  .btn-block{width:100%;}
  .btn-sm{padding:7px 11px; font-size:12.5px; border-radius:9px;}
  .btn-row{display:flex; gap:8px;}
  .btn-ghost{background:transparent; border-color:transparent; color:var(--muted); padding:6px 4px;}

  /* tabbar */
  .tabbar{position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; background:var(--surface); border-top:1px solid var(--line); padding: 8px 10px calc(8px + env(safe-area-inset-bottom,0px));}
  .tabbar-inner{display:flex; width:100%; max-width:560px; gap:4px;}
  .tab-btn{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; color:var(--muted); font-family:"Work Sans"; font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; padding:6px 2px; border-radius:10px; cursor:pointer;}
  .tab-btn svg{width:20px; height:20px;}
  .tab-btn.active{color:var(--ink); background:var(--surface-2);}

  /* forms */
  label{display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin-bottom:5px;}
  input, select{width:100%; font-family:"IBM Plex Mono",monospace; font-size:15px; padding:10px 11px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink);}
  input[type=text]{font-family:"Work Sans";}
  .field{margin-bottom:12px;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}

  /* list items */
  .list-item{display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--line); gap:10px;}
  .list-item:last-child{border-bottom:none;}
  .li-main{min-width:0;}
  .li-title{font-weight:600; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .li-sub{font-size:12px; color:var(--muted); margin-top:2px;}
  .li-val{font-family:"IBM Plex Mono"; font-weight:600; font-size:14px; white-space:nowrap;}

  .badge{display:inline-block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:3px 8px; border-radius:20px; background:var(--surface-2); color:var(--muted);}
  .badge.lime{background:var(--lime); color:var(--ink);}
  .badge.coral{background:var(--coral); color:#fff;}

  .empty{padding:22px 4px; text-align:center; color:var(--muted); font-size:13.5px;}
  .empty .big{font-family:"Big Shoulders Display"; font-size:20px; color:var(--ink); font-weight:700; display:block; margin-bottom:4px;}

  .tag-row{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px;}
  .tag-row::-webkit-scrollbar{display:none;}
  .food-chip{flex:0 0 auto; background:var(--surface-2); border:1px solid var(--line); border-radius:11px; padding:8px 10px; font-size:12.5px; cursor:pointer; white-space:nowrap;}
  .food-chip b{font-family:"IBM Plex Mono"; font-weight:600;}

  .section-tabs{display:flex; gap:6px; margin-bottom:14px;}
  .section-tabs button{flex:1; padding:9px 4px; border-radius:11px; border:1px solid var(--line); background:var(--surface); color:var(--muted); font-weight:600; font-size:12.5px; cursor:pointer;}
  .section-tabs button.active{background:var(--ink); color:var(--bg); border-color:var(--ink);}

  svg.chart text{fill:var(--muted); font-family:"IBM Plex Mono",monospace; font-size:9px;}
  .chart-wrap{overflow-x:auto;}
  .chart-wrap svg{display:block;}

  table.plain{width:100%; border-collapse:collapse; font-size:13px;}
  table.plain th{text-align:left; font-size:10.5px; text-transform:uppercase; color:var(--muted); font-weight:600; padding-bottom:8px; letter-spacing:.03em;}
  table.plain td{padding:7px 0; border-top:1px solid var(--line); font-family:"IBM Plex Mono"; font-variant-numeric:tabular-nums;}

  .toast{position:fixed; left:50%; bottom:calc(78px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); font-size:12.5px; font-weight:600; padding:9px 16px; border-radius:20px; z-index:50; opacity:0; pointer-events:none; transition:opacity .2s ease;}
  .toast.show{opacity:1;}

  .scanner-overlay{position:fixed; inset:0; background:rgba(10,10,6,.85); z-index:60; display:flex; align-items:center; justify-content:center; padding:16px;}
  .scanner-overlay[hidden]{display:none;}
  .scanner-box{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px; width:100%; max-width:420px; max-height:92vh; overflow-y:auto;}
  .scanner-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .scanner-head h2{font-size:18px;}
  #scanner-reader{width:100%; border-radius:12px; overflow:hidden; background:#000; min-height:220px;}
  #scanner-reader video{border-radius:12px;}
  .scanner-status{font-size:12.5px; color:var(--muted); margin:10px 0; min-height:16px;}
  .scanner-status.error{color:var(--bad);}
  .scanner-manual{border-top:1px solid var(--line); padding-top:12px; margin-top:4px;}
  .scanner-manual label{margin-bottom:6px;}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }
</style>
</head>
<body>


<div class="container">
  <div class="topbar">
    <div class="brand">
      <h1>Pulp</h1>
      <span class="tag">P.U.L.P — Prise Utile, Ligne de Progression</span>
    </div>
    <div style="display:flex; align-items:center;">
      <div class="date-chip" id="date-chip"></div>
      <div class="theme-toggle" id="theme-toggle">
        <button class="theme-btn" data-theme-choice="light" aria-label="Thème clair" title="Clair">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8L6 18M18 6l1.8-1.8"/></svg>
        </button>
        <button class="theme-btn" data-theme-choice="system" aria-label="Thème système" title="Auto">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M8 20h8M12 16.5V20" stroke-linecap="round"/></svg>
        </button>
        <button class="theme-btn" data-theme-choice="dark" aria-label="Thème sombre" title="Sombre">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="weekstrip" id="weekstrip"></div>

  <div id="tab-today"></div>
  <div id="tab-workouts" hidden></div>
  <div id="tab-nutrition" hidden></div>
  <div id="tab-weight" hidden></div>
</div>

<div class="toast" id="toast"></div>

<div class="scanner-overlay" id="scanner-overlay" hidden>
  <div class="scanner-box">
    <div class="scanner-head">
      <h2>Scanner un code-barre</h2>
      <button class="btn-ghost" data-action="close-scanner" aria-label="Fermer">✕</button>
    </div>
    <div id="scanner-reader"></div>
    <div class="scanner-status" id="scanner-status"></div>
    <div class="scanner-manual">
      <label>Ou saisis le code-barre</label>
      <div class="field-row">
        <div class="field" style="margin-bottom:0;"><input type="text" inputmode="numeric" id="scanner-manual-input" placeholder="ex. 3017620422003"></div>
        <button class="btn btn-primary" data-action="submit-manual-barcode">Valider</button>
      </div>
    </div>
  </div>
</div>

<nav class="tabbar"><div class="tabbar-inner">
  <button class="tab-btn" data-tab="today">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
    Jour
  </button>
  <button class="tab-btn" data-tab="workouts">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8v8M2 10v4M20 8v8M22 10v4M7 12h10" stroke-linecap="round"/><rect x="4.5" y="7" width="2.5" height="10" rx="1"/><rect x="17" y="7" width="2.5" height="10" rx="1"/></svg>
    Séances
  </button>
  <button class="tab-btn" data-tab="nutrition">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3c-1 2-1 3.5 0 5 1-1.5 1-3 0-5Z"/><path d="M12 8c-4.5 0-7.5 3.3-7.5 7.3C4.5 19 7.5 21 12 21s7.5-2 7.5-5.7C19.5 11.3 16.5 8 12 8Z"/></svg>
    Nutrition
  </button>
  <button class="tab-btn" data-tab="weight">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="13" r="8"/><path d="M12 13l2.6-2.6M9 5h6"/></svg>
    Poids
  </button>
</div></nav>

<script>
(function(){
  "use strict";

  var state = JSON.parse(document.getElementById('pulp-state').textContent);
  var activeTab = (location.hash || '#today').replace('#','');
  if(!['today','workouts','nutrition','weight'].includes(activeTab)) activeTab = 'today';
  // Base locale d'aliments courants (valeurs moyennes pour 100 g / 100 ml, cru sauf mention "cuit").
  // Sert de référence rapide et fiable hors-ligne pour les aliments simples, en complément
  // d'Open Food Facts (plus fort sur les produits emballés/de marque).
  var LOCAL_FOOD_DB = [

  function searchLocalFoods(query){
    var q = query.toLowerCase().trim();
    if(!q) return [];
    var scored = LOCAL_FOOD_DB.map(function(f){
      var name = f.name.toLowerCase();
      var hay = name + ' ' + (f.alias||'').toLowerCase();
      var score = -1;
      if(name.indexOf(q) === 0) score = 0;
      else if(hay.indexOf(q) !== -1) score = 1;
      return { f: f, score: score };
    }).filter(function(x){ return x.score >= 0; })
      .sort(function(a,b){ return a.score - b.score; })
      .slice(0, 8)
      .map(function(x){
        return { name: x.f.name, brand:'', source:'local', kcal100:x.f.kcal, protein100:x.f.protein, carbs100:x.f.carbs, fat100:x.f.fat,
          portion: x.f.portion || null, portionLabel: x.f.portionLabel || null };
      });
    return scored;
  }

  }

  function weekDates(){
    // returns array of 7 ISO dates for current week, Monday first
    var now = new Date();
    var dow = now.getDay(); // 0 sun .. 6 sat
    var mondayOffset = (dow === 0) ? -6 : (1 - dow);
    var monday = new Date(now); monday.setDate(now.getDate()+mondayOffset);
    var out = [];
    for(var i=0;i<7;i++){ var d = new Date(monday); d.setDate(monday.getDate()+i); out.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')); }
    return out;
  }

  function mealsForDate(iso){ return state.logs.meals.filter(function(m){ return m.date === iso; }); }

  function totalsForDate(iso){
    var meals = mealsForDate(iso);
    return meals.reduce(function(acc,m){
      acc.kcal += m.kcal; acc.protein += m.protein; acc.carbs += m.carbs; acc.fat += m.fat;
      return acc;
    }, {kcal:0, protein:0, carbs:0, fat:0});
  }

  function weightSorted(){
    return state.logs.weight.slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; });
  }

  function rollingAvg7(entries, idx){
    var end = entries[idx].date;
    var from = new Date(end+'T12:00:00'); from.setDate(from.getDate()-6);
    var fromISO = from.toISOString().slice(0,10);
    var slice = entries.filter(function(e){ return e.date >= fromISO && e.date <= end; });
    var sum = slice.reduce(function(s,e){ return s+e.kg; },0);
    return sum / slice.length;
  }

  /* ---------- yuzu pet ---------- */

  var PET_LEVELS = [0,20,50,90,140,200,270,350,450,600];
  var PET_STAGE_NAMES = {1:'Graine', 2:'Pousse', 3:'Jeune Yuzu', 4:'Yuzu Tonique', 5:'Yuzu Champion'};

  function computePetState(){
    var workouts = state.logs.workouts.length;
    var weighIns = state.logs.weight.length;
    var mealDates = {};
    state.logs.meals.forEach(function(m){ mealDates[m.date] = true; });
    var mealDays = Object.keys(mealDates).length;
    var xp = workouts*15 + weighIns*4 + mealDays*5;

    var level = 1;
    for(var i=1;i<PET_LEVELS.length;i++){ if(xp >= PET_LEVELS[i]) level = i+1; }
    var xpForCurrent, xpForNext;
    if(level < PET_LEVELS.length){
      xpForCurrent = PET_LEVELS[level-1];
      xpForNext = PET_LEVELS[level];
    } else {
      // beyond the last defined level, each further level costs 200 more XP
      var lastLevel = PET_LEVELS.length, lastXp = PET_LEVELS[lastLevel-1];
      while(xp >= lastXp + 200){ lastXp += 200; level++; }
      xpForCurrent = lastXp;
      xpForNext = lastXp + 200;
    }

    var stage = level<=2 ? 1 : level<=4 ? 2 : level<=7 ? 3 : level<=11 ? 4 : 5;

    var todayIso = todayISO();
    var trainedToday = !!workoutDoneForDate(todayIso);
    var loggedToday = !!mealDates[todayIso] || state.logs.weight.some(function(w){ return w.date === todayIso; }) || trainedToday;
    var allDates = state.logs.workouts.map(function(w){ return w.date; })
      .concat(state.logs.weight.map(function(w){ return w.date; }))
      .concat(Object.keys(mealDates));
    allDates.sort();
    var lastDate = allDates.length ? allDates[allDates.length-1] : null;
    var daysSince = lastDate ? Math.round((new Date(todayIso+'T12:00:00') - new Date(lastDate+'T12:00:00')) / 86400000) : 99;

    var mood = 'neutre';
    if(loggedToday) mood = 'energique';
    else if(daysSince >= 2) mood = 'fatigue';

    return {
      xp: xp, level: level, stage: stage, stageName: PET_STAGE_NAMES[stage], mood: mood,
      xpIntoLevel: xp - xpForCurrent, xpSpan: Math.max(1, xpForNext - xpForCurrent)
    };
  }

  function petMoodLine(mood, stageName){
    if(mood === 'energique') return stageName + ' est en pleine forme aujourd\'hui.';
    if(mood === 'fatigue') return stageName + ' s\'ennuie un peu, ça fait un moment sans nouvelles.';
    return stageName + ' attend tes données du jour.';
  }

  function petColors(){
    var cs = getComputedStyle(document.documentElement);
    function tok(name, fallback){ var v = cs.getPropertyValue(name); return v ? v.trim() : fallback; }
    return {
      lime: tok('--lime', '#c3ff52'),
      limeDeep: tok('--lime-deep', '#7fae1c'),
      ink: tok('--ink', '#14150f'),
      coral: tok('--coral', '#ff6b45'),
      leaf: '#5f8f2a'
    };
  }

  function drawYuzu(canvas, stage, mood){
    if(!canvas) return;
    var N = 26, scale = 6;
    canvas.width = N*scale; canvas.height = N*scale;
    var ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    var c = petColors();
    var cx = (N-1)/2, cy = (N-1)/2 + 1;
    var radii = [0, 5.2, 6.6, 8.0, 9.4, 10.6];
    var baseR = radii[stage];
    var bumpAmp = stage>=3 ? 0.35 : 0.15;

    var grid = [];
    for(var row=0; row<N; row++){
      grid[row] = [];
      for(var col=0; col<N; col++){
        var dx = col-cx, dy = (row-cy)*1.08;
        var dist = Math.sqrt(dx*dx + dy*dy);
        var angle = Math.atan2(dy,dx);
        var r = baseR + Math.sin(angle*7+stage)*bumpAmp;
        var cell = null;
        if(dist <= r){
          var edge = dist > r-1.6;
          var bottom = dy > 0.4*r;
          cell = (edge||bottom) ? c.limeDeep : c.lime;
        } else if(dist <= r+1){
          cell = c.ink;
        }
        grid[row][col] = cell;
      }
    }

    function setCell(row,col,color){ row=Math.round(row); col=Math.round(col); if(row>=0&&row<N&&col>=0&&col<N) grid[row][col]=color; }

    var eyeY = cy - baseR*0.15;
    var eyeDX = baseR*0.36;
    if(mood === 'fatigue'){
      setCell(eyeY, cx-eyeDX, c.ink); setCell(eyeY, cx-eyeDX-1, c.ink);
      setCell(eyeY, cx+eyeDX, c.ink); setCell(eyeY, cx+eyeDX+1, c.ink);
    } else {
      setCell(eyeY, cx-eyeDX, c.ink); setCell(eyeY+1, cx-eyeDX, c.ink);
      setCell(eyeY, cx+eyeDX, c.ink); setCell(eyeY+1, cx+eyeDX, c.ink);
    }

    var mouthY = cy + baseR*0.18;
    if(mood === 'energique'){
      setCell(mouthY, cx-1, c.ink); setCell(mouthY, cx, c.ink); setCell(mouthY, cx+1, c.ink);
      setCell(mouthY-1, cx-2, c.ink); setCell(mouthY-1, cx+2, c.ink);
    } else if(mood === 'fatigue'){
      setCell(mouthY, cx-1, c.ink); setCell(mouthY, cx, c.ink); setCell(mouthY, cx+1, c.ink);
    } else {
      setCell(mouthY, cx-1, c.ink); setCell(mouthY, cx, c.ink); setCell(mouthY, cx+1, c.ink);
      setCell(mouthY+1, cx-2, c.ink); setCell(mouthY+1, cx+2, c.ink);
    }

    if(stage>=3){
      setCell(eyeY+2, cx-eyeDX-2, c.coral);
      setCell(eyeY+2, cx+eyeDX+2, c.coral);
    }

    if(stage<=3){
      var topRow = cy-baseR-1;
      setCell(topRow, cx, c.leaf);
      setCell(topRow-1, cx, c.leaf);
      setCell(topRow-1, cx+1, c.leaf);
    }

    if(stage>=4){
      var bandRow = cy - baseR*0.55;
      for(var cc = cx-baseR*0.7; cc <= cx+baseR*0.7; cc++){ setCell(bandRow, cc, c.coral); }
      var armLen = stage===5 ? 3 : 2;
      for(var a=0;a<armLen;a++){
        setCell(cy-1, cx-baseR-a, c.limeDeep);
        setCell(cy-1, cx+baseR+a, c.limeDeep);
      }
    }

    if(stage===5){
      setCell(2,3,c.lime); setCell(1,N-4,c.lime); setCell(N-3,2,c.lime); setCell(3,N-3,c.lime);
    }

    for(var row2=0; row2<N; row2++){
      for(var col2=0; col2<N; col2++){
        if(grid[row2][col2]){
          ctx.fillStyle = grid[row2][col2];
          ctx.fillRect(col2*scale, row2*scale, scale, scale);
        }
      }
    }
  }

  function renderPetCard(){
    var p = computePetState();
    var html = '<div class="card pet-card">';
    html += '<div class="pet-canvas-wrap"><canvas id="pet-canvas" width="1" height="1"></canvas></div>';
    html += '<div class="pet-info">';
    html += '<div class="pet-name-row"><span class="pet-name">Yuzu</span><span class="pet-stage">Niveau '+p.level+' · '+p.stageName+'</span></div>';
    html += '<div class="pet-line">'+petMoodLine(p.mood, p.stageName)+'</div>';
    html += '<div class="pet-xptrack"><div class="pet-xpfill" style="width:'+clamp(p.xpIntoLevel/p.xpSpan*100,2,100)+'%"></div></div>';
    html += '<div class="pet-xplabel">'+p.xpIntoLevel+' / '+p.xpSpan+' XP avant le niveau '+(p.level+1)+'</div>';
    html += '</div></div>';
    return { html: html, stage: p.stage, mood: p.mood };
  }

  function applyTheme(choice){
    var root = document.documentElement;
    if(choice === 'light') root.setAttribute('data-theme','light');
    else if(choice === 'dark') root.setAttribute('data-theme','dark');
    else root.removeAttribute('data-theme');
    try{ localStorage.setItem('pulp-theme', choice); }catch(e){}
    document.querySelectorAll('.theme-btn').forEach(function(b){
      b.classList.toggle('active', b.dataset.themeChoice === choice);
    });
  }

  function loadTheme(){
    var saved = 'system';
    try{ saved = localStorage.getItem('pulp-theme') || 'system'; }catch(e){}
    applyTheme(saved);
  }

      btn.classList.toggle('active', btn.dataset.tab === activeTab);

  function renderWeekStrip(){
    var el = document.getElementById('weekstrip');
    var dates = weekDates();
    var todayIso = todayISO();
    el.innerHTML = dates.map(function(iso){
      var d = new Date(iso+'T12:00:00');
      var dow = d.getDay();
      var plan = planForDow(dow);
      var isToday = iso === todayIso;
      var done = plan ? !!workoutDoneForDate(iso) : false;
      var cls = 'day-chip' + (isToday ? ' today' : '') + (done ? ' done' : '') + (!plan ? ' rest' : '');
      return '<div class="'+cls+'">' +
        (done ? '<span class="check">✓</span>' : '') +
        '<div class="d">'+DOW_LABEL[dow]+'</div>' +
        '<div class="l">'+(plan ? plan.label.replace('Séance ','S.') : 'Repos')+'</div>' +
        '</div>';
    }).join('');
  }

  /* ---------- render: today ---------- */

  function renderToday(){
    var iso = todayISO();
    var totals = totalsForDate(iso);
    var p = state.profile;
    var plan = planForDow(new Date().getDay());
    var done = plan ? workoutDoneForDate(iso) : null;
    var wsorted = weightSorted();
    var lastW = wsorted.length ? wsorted[wsorted.length-1] : null;
    var lastAvg = wsorted.length ? rollingAvg7(wsorted, wsorted.length-1) : null;

    var macroRow = function(name, val, target, unit){
      var pct = clamp(target ? (val/target*100) : 0, 0, 130);
      var over = val > target;
      return '<div class="prog-row"><div class="prog-label"><span class="name">'+name+'</span><span class="mono">'+fmt1(val)+' / '+target+' '+unit+'</span></div>' +
        '<div class="prog-track"><div class="prog-fill'+(over?' over':'')+'" style="width:'+clamp(pct,0,100)+'%"></div></div></div>';
    };

    var pet = renderPetCard();
    var html = '';
    html += pet.html;
    html += '<div class="card"><div class="card-title"><h2>Séance du jour</h2>' + (plan ? '<span class="badge'+(done?' lime':'')+'">'+(done?'Faite':'À faire')+'</span>' : '<span class="badge">Repos</span>') + '</div>';
    if(plan){
      html += '<div class="li-title" style="font-size:17px;margin-bottom:4px;">'+plan.label+' · <span class="muted" style="font-weight:400;font-size:13px;">'+(plan.type==='yoga'?'récupération active':'renforcement, full body')+'</span></div>';
      html += '<div class="btn-row" style="margin-top:10px;">' +
        '<button class="btn btn-primary btn-block" data-action="go-log-today">'+(done?'Voir la séance':'Logger la séance')+'</button>' +
        '</div>';
    } else {
      html += '<div class="muted" style="font-size:13.5px;">Jour de repos — la prise de masse se joue aussi ici : reste proche de ton objectif calorique.</div>';
    }
    html += '</div>';

    html += '<div class="card"><div class="card-title"><h2>Nutrition</h2><span class="badge">'+Math.round(totals.kcal)+' kcal</span></div>';
    html += macroRow('Protéines', totals.protein, p.targetProtein, 'g');
    html += macroRow('Glucides', totals.carbs, p.targetCarbs, 'g');
    html += macroRow('Lipides', totals.fat, p.targetFat, 'g');
    html += '<button class="btn btn-lime btn-block" style="margin-top:14px;" data-action="go-add-meal">+ Ajouter un repas</button>';
    html += '</div>';

    html += '<div class="card"><div class="card-title"><h2>Poids</h2>' + (lastAvg ? '<span class="badge">moy. 7j '+fmt1(lastAvg)+' kg</span>' : '') + '</div>';
    if(lastW){
      html += '<div class="stat-row">' +
        '<div class="stat-tile"><div class="v">'+fmt1(lastW.kg)+'</div><div class="u">Dernière pesée (kg)</div></div>' +

  function renderWeightSparkline(){
    var entries = weightSorted().slice(-14);
    if(entries.length < 2) return '';
    var w = 500, h = 90, pad = 8;
    var vals = entries.map(function(e,i){ return rollingAvg7(weightSorted(), weightSorted().indexOf(e)); });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    if(min === max){ min -= 1; max += 1; }
    var pts = entries.map(function(e,i){
      var x = pad + (i/(entries.length-1)) * (w-2*pad);
      var y = h - pad - ((vals[i]-min)/(max-min)) * (h-2*pad);
      return x.toFixed(1)+','+y.toFixed(1);
    }).join(' ');
    return '<div class="chart-wrap"><svg class="chart" viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none">' +
      '<polyline points="'+pts+'" fill="none" stroke="var(--lime-deep)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<circle cx="'+pts.split(' ').slice(-1)[0].split(',')[0]+'" cy="'+pts.split(' ').slice(-1)[0].split(',')[1]+'" r="3.5" fill="var(--ink)"/>' +
      '</svg></div>';
  }

  function runFoodSearch(){
    var input = document.getElementById('fs-query');
    var query = input ? input.value.trim() : '';
    if(!query){ return; }
    foodSearch.query = query;
    foodSearch.searched = true;
    foodSearch.onlineLoading = true;
    foodSearch.onlineError = null;
    foodSearch.picked = null;
    foodSearch.results = searchLocalFoods(query);
    renderNutrition();

    var url = 'https://world.openfoodfacts.org/cgi/search.pl?search_terms=' + encodeURIComponent(query) +
      '&search_simple=1&action=process&json=1&page_size=8&lc=fr' +
      '&fields=product_name,product_name_fr,brands,nutriments';

    fetch(url).then(function(res){
      if(!res.ok) throw new Error('http ' + res.status);
      return res.json();
    }).then(function(data){
      var products = (data && data.products) || [];
      var online = products.map(function(p){
        var n = p.nutriments || {};
        var kcal100 = n['energy-kcal_100g'];
        if(kcal100 == null && n['energy_100g'] != null) kcal100 = n['energy_100g'] / 4.184;
        return {
          name: p.product_name_fr || p.product_name || null,
          brand: p.brands || '',
          source: 'off',
          kcal100: kcal100,
          protein100: n['proteins_100g'],
          carbs100: n['carbohydrates_100g'],
          fat100: n['fat_100g']
        };
      }).filter(function(r){
        return r.name && r.kcal100 != null && r.protein100 != null && r.carbs100 != null && r.fat100 != null;
      }).slice(0, 6);

      // ignore stale response if the query changed in the meantime
      if(foodSearch.query !== query) return;
      foodSearch.onlineLoading = false;
      foodSearch.results = (foodSearch.results || []).concat(online);
      renderNutrition();
    }).catch(function(err){
      if(foodSearch.query !== query) return;
      foodSearch.onlineLoading = false;
      foodSearch.onlineError = 'Connexion au service impossible.';
      renderNutrition();
    });
  }

  /* ---------- barcode scanner ---------- */

  var qrLibPromise = null;
  var scannerInstance = null;
  var scanHandled = false;

  function loadQrLib(){
    if(window.Html5Qrcode) return Promise.resolve();
    if(qrLibPromise) return qrLibPromise;
    qrLibPromise = new Promise(function(resolve, reject){
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';
      s.onload = function(){ resolve(); };
      s.onerror = function(){ qrLibPromise = null; reject(new Error('load-fail')); };
      document.head.appendChild(s);
    });
    return qrLibPromise;
  }

  function setScannerStatus(msg, isError){
    var el = document.getElementById('scanner-status');
    if(!el) return;
    el.textContent = msg || '';
    el.className = 'scanner-status' + (isError ? ' error' : '');
  }

  function openScanner(){
    scanHandled = false;
    var overlay = document.getElementById('scanner-overlay');
    var input = document.getElementById('scanner-manual-input');
    if(input) input.value = '';
    if(overlay) overlay.hidden = false;
    setScannerStatus('Chargement du scanner…');
    loadQrLib().then(function(){
      startScanner();
    }).catch(function(){
      setScannerStatus('Scanner indisponible (pas de connexion). Utilise la saisie manuelle ci-dessous.', true);
    });
  }

  function startScanner(){
    if(!document.getElementById('scanner-reader')) return;
    try{
      var formats = (window.Html5QrcodeSupportedFormats) ? [
        Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.CODE_128
      ] : null;
      scannerInstance = formats ? new Html5Qrcode('scanner-reader', { formatsToSupport: formats, verbose:false })
                                 : new Html5Qrcode('scanner-reader');
    } catch(e){
      setScannerStatus('Scanner indisponible sur ce navigateur. Utilise la saisie manuelle ci-dessous.', true);
      return;
    }
    setScannerStatus('Vise le code-barre avec la caméra…');
    scannerInstance.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 260, height: 160 } },
      function(decodedText){
        if(scanHandled) return;
        scanHandled = true;
        setScannerStatus('Code détecté : ' + decodedText);
        closeScanner();
        lookupBarcode(decodedText);
      },
      function(){ /* ignore per-frame decode misses */ }
    ).catch(function(){
      setScannerStatus('Caméra inaccessible (autorisation refusée ou indisponible). Utilise la saisie manuelle ci-dessous.', true);
    });
  }

  function closeScanner(){
    var overlay = document.getElementById('scanner-overlay');
    if(overlay) overlay.hidden = true;
    var inst = scannerInstance;
    scannerInstance = null;
    if(inst){
      inst.stop().then(function(){ try{ inst.clear(); }catch(e){} }).catch(function(){});
    }
  }

  function lookupBarcode(code){
    code = (code || '').trim();
    if(!code) return;
    activeTab = 'nutrition'; location.hash = '#nutrition'; renderShell();
    foodSearch.show = true;
    foodSearch.query = code;
    foodSearch.searched = true;
    foodSearch.onlineLoading = true;
    foodSearch.onlineError = null;
    foodSearch.results = [];
    foodSearch.picked = null;
    renderNutrition();

    var url = 'https://world.openfoodfacts.org/api/v2/product/' + encodeURIComponent(code) + '.json' +
      '?fields=product_name,product_name_fr,brands,nutriments';

    fetch(url).then(function(res){
      if(!res.ok) throw new Error('http ' + res.status);
      return res.json();
    }).then(function(data){
      foodSearch.onlineLoading = false;
      if(!data || data.status !== 1 || !data.product){
        foodSearch.onlineError = 'Produit introuvable pour le code ' + code + '. Essaie la recherche par nom ou la saisie manuelle.';
        renderNutrition();
        return;
      }
      var p = data.product;
      var n = p.nutriments || {};
      var kcal100 = n['energy-kcal_100g'];
      if(kcal100 == null && n['energy_100g'] != null) kcal100 = n['energy_100g'] / 4.184;
      var result = {
        name: p.product_name_fr || p.product_name || ('Produit ' + code),
        brand: p.brands || '',
        source: 'off',
        kcal100: kcal100,
        protein100: n['proteins_100g'],
        carbs100: n['carbohydrates_100g'],
        fat100: n['fat_100g']
      };
      if(result.kcal100 == null || result.protein100 == null || result.carbs100 == null || result.fat100 == null){
        foodSearch.onlineError = 'Valeurs nutritionnelles incomplètes pour ce produit. Saisis-les manuellement.';
        renderNutrition();
        return;
      }
      foodSearch.results = [result];
      foodSearch.picked = 0;
      foodSearch.grams = 100;
      renderNutrition();
      toast(result.name + ' trouvé');
    }).catch(function(){
      foodSearch.onlineLoading = false;
      foodSearch.onlineError = 'Connexion au service impossible.';
      renderNutrition();
    });
  }

    var fat = parseFloat(document.getElementById('cm-fat').value) || 0;
    state.logs.meals.push({ id: uid(), date: todayISO(), name:name, kcal:kcal, protein:protein, carbs:carbs, fat:fat });
    customMeal = {name:'', kcal:'', protein:'', carbs:'', fat:'', show:false};
    persist();
    renderNutrition();
    toast('Repas ajouté');
  }

  function removeMeal(id){
    state.logs.meals = state.logs.meals.filter(function(m){ return m.id !== id; });
    persist();
    renderNutrition();
  }

  /* ---------- render: weight ---------- */

  var weightDraft = { kg:'' };

  function renderWeight(){
    var entries = weightSorted();
    var html = '<div class="card"><div class="card-title"><h2>Nouvelle pesée</h2></div>';
    html += '<div class="field-row" style="align-items:end;"><div class="field"><label>Poids (kg)</label><input type="number" step="0.1" id="w-kg" value="'+weightDraft.kg+'"></div>' +
      '<button class="btn btn-lime" style="height:44px;" data-action="save-weight">Ajouter</button></div>';
    html += '</div>';

    html += '<div class="card"><div class="card-title"><h2>Courbe</h2></div>';
    if(entries.length < 2){
      html += '<div class="empty"><span class="big">Encore peu de données</span>Ajoute au moins 2 pesées pour voir la courbe.</div>';
    } else {
      html += renderWeightChart(entries);
    }
    html += '</div>';

    html += '<div class="card"><div class="card-title"><h2>Historique</h2></div>';
    if(!entries.length){
      html += '<div class="empty"><span class="big">Aucune pesée</span></div>';
    } else {
      html += '<table class="plain"><thead><tr><th>Date</th><th>Poids</th><th>Moy. 7j</th></tr></thead><tbody>';
      html += entries.slice().reverse().slice(0,20).map(function(e){
        var i = entries.indexOf(e);
        return '<tr><td>'+dateLabel(e.date)+'</td><td>'+fmt1(e.kg)+' kg</td><td>'+fmt1(rollingAvg7(entries,i))+' kg</td></tr>';
      }).join('') + '</tbody></table>';
    }
    html += '</div>';

    document.getElementById('tab-weight').innerHTML = html;
  }

  function renderWeightChart(entries){
    var w = 500, h = 160, pad = 24;
    var kgs = entries.map(function(e){ return e.kg; });
    var avgs = entries.map(function(e,i){ return rollingAvg7(entries,i); });
    var min = Math.min.apply(null, kgs), max = Math.max.apply(null, kgs);
    if(min === max){ min -= 1; max += 1; }
    min -= 0.5; max += 0.5;
    var x = function(i){ return pad + (i/(entries.length-1)) * (w-2*pad); };
    var y = function(v){ return h-pad - ((v-min)/(max-min)) * (h-2*pad); };

    var rawPts = entries.map(function(e,i){ return x(i).toFixed(1)+','+y(e.kg).toFixed(1); }).join(' ');
    var avgPts = avgs.map(function(v,i){ return x(i).toFixed(1)+','+y(v).toFixed(1); }).join(' ');

    var ticks = [min, (min+max)/2, max].map(function(v){
      return '<line x1="'+pad+'" x2="'+(w-pad)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>' +
        '<text x="2" y="'+(y(v)+3).toFixed(1)+'">'+fmt1(v)+'</text>';
    }).join('');

    return '<div class="chart-wrap"><svg class="chart" viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'">' +
      ticks +
      '<polyline points="'+rawPts+'" fill="none" stroke="var(--line)" stroke-width="1.5" stroke-linejoin="round"/>' +
      '<polyline points="'+avgPts+'" fill="none" stroke="var(--lime-deep)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' +
      '</svg></div><div class="muted" style="font-size:11.5px;margin-top:4px;">Ligne claire : pesées · Ligne verte : moyenne mobile 7 jours</div>';
  }

  function saveWeight(){
    var kg = parseFloat(document.getElementById('w-kg').value);
    if(!kg || kg <= 0){ toast('Entre un poids valide'); return; }
    var iso = todayISO();
    var existing = state.logs.weight.find(function(e){ return e.date === iso; });
    if(existing) existing.kg = kg; else state.logs.weight.push({ id: uid(), date: iso, kg: kg });
    weightDraft.kg = '';
    persist();
    renderWeight();
    toast('Pesée enregistrée');
  }

  /* ---------- event delegation ---------- */

  document.addEventListener('click', function(e){
    var btn = e.target.closest('[data-action]');
    var tabBtn = e.target.closest('.tab-btn');
    if(tabBtn){
      activeTab = tabBtn.dataset.tab;
      location.hash = '#' + activeTab;
      renderShell();
      renderActiveTab();
      return;
    }
    var themeBtn = e.target.closest('.theme-btn');
    if(themeBtn){ applyTheme(themeBtn.dataset.themeChoice); renderActiveTab(); return; }
    if(!btn) return;
    var action = btn.dataset.action;
    if(action === 'go-log-today'){ activeTab='workouts'; location.hash='#workouts'; renderShell(); startTodayLog(); }
    else if(action === 'start-today-log'){ startTodayLog(); }
    else if(action === 'back-workouts'){ workoutsSub='list'; logDraft=null; renderWorkouts(); }
    else if(action === 'edit-workout'){ editWorkout(btn.dataset.id); }
    else if(action === 'add-set'){
      var exIdx = parseInt(btn.dataset.ex,10);
      logDraft.exercises[exIdx].sets.push({weight:null, reps:null});
      renderWorkouts();
    }
    else if(action === 'save-workout'){ saveWorkout(); }
    else if(action === 'go-add-meal'){ activeTab='nutrition'; location.hash='#nutrition'; renderShell(); renderActiveTab(); }
    else if(action === 'add-food'){ addFoodToLog(btn.dataset.id); }
    else if(action === 'show-food-search'){ foodSearch.show = true; renderNutrition(); var q=document.getElementById('fs-query'); if(q) q.focus(); }
    else if(action === 'run-food-search'){ runFoodSearch(); }
    else if(action === 'scan-barcode'){ openScanner(); }
    else if(action === 'close-scanner'){ closeScanner(); }
    else if(action === 'submit-manual-barcode'){
      var mi = document.getElementById('scanner-manual-input');
      var code = mi ? mi.value.trim() : '';
      if(code){ closeScanner(); lookupBarcode(code); }
    }
    else if(action === 'pick-food-result'){ pickFoodResult(parseInt(btn.dataset.idx,10)); }
    else if(action === 'add-search-result'){ addSearchResultToLog(); }
    else if(action === 'show-custom-meal'){ customMeal.show = true; renderNutrition(); }
    else if(action === 'save-custom-meal'){ saveCustomMeal(); }
    else if(action === 'remove-meal'){ removeMeal(btn.dataset.id); }
    else if(action === 'go-add-weight'){ activeTab='weight'; location.hash='#weight'; renderShell(); renderActiveTab(); }
    else if(action === 'save-weight'){ saveWeight(); }
  });

  document.addEventListener('input', function(e){
    var t = e.target;
    if(t.matches('[data-set-field]')){
      var exIdx = parseInt(t.dataset.ex,10), sIdx = parseInt(t.dataset.set,10);
      var val = t.value === '' ? null : parseFloat(t.value);
      logDraft.exercises[exIdx].sets[sIdx][t.dataset.setField] = val;
    }
    else if(t.id === 'fs-grams' && foodSearch.picked != null && foodSearch.results){
      var g = parseFloat(t.value) || 0;
      foodSearch.grams = g;
      var r = foodSearch.results[foodSearch.picked];
      var scale = g/100;
      var elK = document.getElementById('fs-v-kcal'), elP = document.getElementById('fs-v-protein'),
          elC = document.getElementById('fs-v-carbs'), elF = document.getElementById('fs-v-fat');
      if(elK) elK.textContent = Math.round(r.kcal100*scale);
      if(elP) elP.textContent = round1(r.protein100*scale)+'g';
      if(elC) elC.textContent = round1(r.carbs100*scale)+'g';
      if(elF) elF.textContent = round1(r.fat100*scale)+'g';
    }
  });

  document.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && e.target && e.target.id === 'fs-query'){
      e.preventDefault();
      runFoodSearch();
    }
  });

  function renderActiveTab(){
    if(activeTab === 'today') renderToday();
    else if(activeTab === 'workouts') renderWorkouts();
    else if(activeTab === 'nutrition') renderNutrition();
    else if(activeTab === 'weight') renderWeight();
  }

  window.addEventListener('hashchange', function(){
    var t = (location.hash||'#today').replace('#','');
    if(['today','workouts','nutrition','weight'].includes(t)){
      activeTab = t; renderShell(); renderActiveTab();
    }
  });

  function boot(){
    var saved = localLoad();
    if(saved) state = saved;
    loadTheme();
    setSyncDot('');
    renderShell();
    renderActiveTab();
  }

  boot();
})();
</script>

</body>
</html>
